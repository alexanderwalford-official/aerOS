# GRUB's menu on a disk AerOS was installed on (sys/install.h): the installer writes this as
# /boot/grub/grub.cfg. GRUB finds it on the disk's first partition, which is also where
# everything below is looked for
set timeout=0
set default="0"
# GRUB only sets up graphics modes with its video drivers loaded
insmod all_video
# a resolution chosen with AerOS's RES command, saved as /grubenv on the AEROS volume
if [ -f /grubenv ]; then
	load_env --file /grubenv aeros_mode
fi
menuentry "AerOS" {
	multiboot /boot/main.elf
	# multiboot sets gfxpayload from the kernel's header, so this has to come after it
	if [ -n "$aeros_mode" ]; then
		set gfxpayload="$aeros_mode"
	fi
}
