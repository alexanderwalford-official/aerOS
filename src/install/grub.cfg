# GRUB's menu on a disk AerOS was installed on (sys/install.h): the installer writes this as
# /boot/grub/grub.cfg. GRUB finds it on the disk's first partition, which is also where
# everything below is looked for
set timeout=0
set default="0"
# GRUB only sets up graphics modes with its video drivers loaded
insmod all_video
# AerOS's settings for GRUB, in /grubenv on the AEROS volume (sys/grubenv.h): a resolution chosen
# with AerOS's RES command, and whether there is an update to try
if [ -f /grubenv ]; then
	load_env --file /grubenv aeros_mode aeros_update
fi
# Which AerOS to start (sys/update.h). Usually main.elf. After an update it is the new main.elf,
# once, as a "trial": GRUB writes down that it tried it before starting it, and AerOS takes that
# out again when it gets going. If it didn't (the new one stopped, and the computer was started
# again), the one from before, old.elf, is started instead, and puts itself back
set kernel=/boot/main.elf
set words=""
if [ "$aeros_update" = "new" ]; then
	set aeros_update=tried
	save_env --file /grubenv aeros_update
	set words=trial
elif [ "$aeros_update" = "tried" -a -f /boot/old.elf ]; then
	set kernel=/boot/old.elf
	set words=fallback
fi
menuentry "AerOS" {
	multiboot $kernel $words
	# multiboot sets gfxpayload from the kernel's header, so this has to come after it.
	# The size the kernel asks for (1024x768x32) and "auto" follow the saved one, in case the
	# graphics card can't do it here: without them GRUB would fall back to text mode
	if [ -n "$aeros_mode" ]; then
		set gfxpayload="$aeros_mode,1024x768x32,auto"
	fi
}
