# nginx.conf - nginx in front of the AerOS package server (tools/pkgserver/server.py)
#
# Goes in /etc/nginx/sites-available/packages (linked from sites-enabled/). See
# docs/PACKAGES.md, "Running the server", for the whole setup.
#
#   http://   (port 80)  what AerOS fetches: the landing page, index.txt, index.sig and
#                        packages/. NO redirect to https: AerOS can't do HTTPS, and everything
#                        it fetches is signed, so plain HTTP is safe for it. /admin/ isn't here.
#   https://  (port 443) the same pages, and /admin/publish, which carries the publish token,
#                        so it must only ever travel encrypted.
#
# When certbot sets up the certificate, answer NO to redirecting HTTP to HTTPS.

# publishing is a few requests a day at most: anything faster than 10 a minute from one
# address is turned away, so the token can't be guessed by trying many
limit_req_zone $binary_remote_addr zone=aerpkg_admin:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name packages.intercon.network;

    # the publish side never answers on plain http, even to say it exists
    location /admin/ {
        return 404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # sent as stored: the signatures are of these exact bytes
        gzip off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name packages.intercon.network;

    # certbot fills these in (certbot --nginx -d packages.intercon.network)
    ssl_certificate     /etc/letsencrypt/live/packages.intercon.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/packages.intercon.network/privkey.pem;

    location = /admin/publish {
        limit_req zone=aerpkg_admin burst=5 nodelay;
        limit_except POST { deny all; }
        # a 4 MB program, in base64, plus the index (server.py's UPLOAD_MAX)
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        return 404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        gzip off;
    }
}
